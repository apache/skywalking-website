<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Capture and replay LangChain and LangGraph conversations</title>
  <desc id="desc">A LangGraph agent with a sub-agent and tools sends its tracing to Apache SkyWalking AI Sessionizer, which replays the conversation with its streams, tool calls and model requests, locally or in SkyWalking.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071423"/>
      <stop offset="1" stop-color="#0c2233"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70b7ff"/>
    </marker>
    <style>
      .headline { fill: #f2f7fc; font: 600 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #c0cfdd; font: 400 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .brand { fill: #90a8be; font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; }
      .panel { fill: #0d1d2d; stroke: #2b435b; stroke-width: 2; }
      .panel-accent { fill: #0c2630; stroke: #2a746f; stroke-width: 2; }
      .label { fill: #f2f7fc; font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #c0cfdd; font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #70b7ff; font: 400 19px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .call { fill: #142c41; stroke: #70b7ff; stroke-width: 2; }
      .tool { fill: #2a2412; stroke: #f5a742; stroke-width: 2; }
      .child { fill: #0c2630; stroke: #2dd4bf; stroke-width: 2; }
      .flow { stroke: #70b7ff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .rel { stroke: #2dd4bf; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <text class="brand" x="80" y="110">APACHE SKYWALKING AI SESSIONIZER 0.5.0</text>
  <text class="headline" x="80" y="190">Capture and replay</text>
  <text class="headline" x="80" y="256">LangChain and LangGraph</text>
  <text class="headline" x="80" y="322">conversations</text>
  <text class="sub" x="80" y="384">Your agent, your tools, your sub-agents.</text>
  <text class="sub" x="80" y="422">Four environment variables. No change to the code.</text>

  <!-- the agent -->
  <rect class="panel" x="80" y="500" width="560" height="300" rx="18"/>
  <text class="label" x="108" y="544">Your LangGraph agent</text>
  <rect class="call" x="108" y="572" width="120" height="56" rx="10"/>
  <text class="body" x="124" y="607">model</text>
  <rect class="tool" x="248" y="572" width="120" height="56" rx="10"/>
  <text class="body" x="264" y="607">tool</text>
  <rect class="call" x="388" y="572" width="120" height="56" rx="10"/>
  <text class="body" x="404" y="607">model</text>
  <rect class="tool" x="528" y="572" width="88" height="56" rx="10"/>
  <text class="body" x="544" y="607">tool</text>
  <path class="rel" d="M 308 628 L 308 672"/>
  <rect class="child" x="108" y="676" width="508" height="56" rx="10"/>
  <text class="body" x="124" y="711">sub-agent: its own model calls and tools</text>
  <text class="mono" x="108" y="772">LANGSMITH_ENDPOINT=http://127.0.0.1:1985</text>

  <path class="flow" d="M 640 650 L 730 650"/>

  <!-- sessionizer -->
  <rect class="panel-accent" x="740" y="500" width="330" height="300" rx="18"/>
  <text class="label" x="768" y="544">Sessionizer</text>
  <text class="body" x="768" y="590">receives the tracing</text>
  <text class="body" x="768" y="622">lands the evidence</text>
  <text class="body" x="768" y="654">assembles the conversation</text>
  <text class="body" x="768" y="686">keeps what each call was sent</text>
  <text class="body" x="768" y="718">records what each tool changed</text>
  <text class="mono" x="768" y="768">asz server</text>

  <path class="flow" d="M 1070 650 L 1160 650"/>

  <!-- replay -->
  <rect class="panel" x="1170" y="500" width="350" height="300" rx="18"/>
  <text class="label" x="1198" y="544">Replay</text>
  <text class="body" x="1198" y="590">talks, runs, tool steps</text>
  <text class="body" x="1198" y="622">the sub-agent's own stream</text>
  <text class="body" x="1198" y="654">the request each call got</text>
  <text class="body" x="1198" y="686">the diff each tool wrote</text>
  <text class="body" x="1198" y="718">locally, or in SkyWalking</text>
  <text class="mono" x="1198" y="768">http://127.0.0.1:8787</text>
</svg>
