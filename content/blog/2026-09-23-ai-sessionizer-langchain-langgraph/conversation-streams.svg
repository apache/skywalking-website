<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">One conversation, three streams</title>
  <desc id="desc">The triage conversation has two talks in the supervisor's main stream. The delegate_to_analyst tool step starts the analyst's child stream, whose model calls and tool calls are its own; the child stream ends with the analyst's output, which is the result of the delegate_to_analyst step that started it. The summarise tool step starts an auxiliary stream holding one plain model call, whose reply is the result of summarise. The write_report tool step carries a change record for the file it wrote. The lines show how the streams connect: starts, ends_with and result_of.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6f82"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb0c9"/>
    </marker>
    <style>
      .bg { fill: #071423; }
      .lane { fill: #0d1d2d; stroke: #2b435b; stroke-width: 2; }
      .lane-child { fill: #0c2630; stroke: #2a746f; stroke-width: 2; }
      .lane-aux { fill: #101f2e; stroke: #476784; stroke-width: 2; stroke-dasharray: 9 7; }
      .talk { fill: #102438; stroke: #35516d; stroke-width: 2; }
      .call { fill: #142c41; stroke: #70b7ff; stroke-width: 2; }
      .tool { fill: #2a2412; stroke: #f5a742; stroke-width: 2; }
      .change { fill: #1e1a33; stroke: #a78bfa; stroke-width: 2; }
      .output { fill: #0f3a3a; stroke: #2dd4bf; stroke-width: 2; }
      .title { fill: #f2f7fc; font: 500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .column { fill: #90a8be; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .label { fill: #f2f7fc; font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #f2f7fc; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #c0cfdd; font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #c0cfdd; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #c0cfdd; font: 400 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .rel-label { fill: #2dd4bf; font: 500 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .aux-label { fill: #8fb0c9; font: 500 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .step { stroke: #5b6f82; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .rel { stroke: #2dd4bf; stroke-width: 3; fill: none; stroke-dasharray: 11 7; marker-end: url(#arrow-teal); }
      .rel-soft { stroke: #8fb0c9; stroke-width: 3; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-soft); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="950"/>
  <text class="title" x="60" y="70">One conversation, three streams</text>
  <text class="body" x="60" y="106">The thread id makes the conversation. Everything below is read from what the tracing client sent.</text>

  <!-- ===== main stream ===== -->
  <text class="column" x="60" y="160">MAIN STREAM  ·  the supervisor</text>
  <rect class="lane" x="60" y="176" width="1480" height="384" rx="16"/>

  <!-- talk 1 -->
  <rect class="talk" x="84" y="196" width="1432" height="172" rx="12"/>
  <text class="label" x="104" y="228">Talk 1</text>
  <text class="body" x="180" y="228">"Checkout latency is up. Look at checkout and payment."</text>

  <rect class="call" x="104" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="120" y="286">model call</text>
  <text class="mono" x="120" y="314">request + reply</text>
  <path class="step" d="M 278 296 L 307 296"/>

  <rect class="tool" x="309" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="325" y="286">tool step</text>
  <text class="mono" x="325" y="314">service_health</text>
  <path class="step" d="M 483 296 L 512 296"/>

  <rect class="call" x="514" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="530" y="286">model call</text>
  <text class="mono" x="530" y="314">sees the result</text>
  <path class="step" d="M 688 296 L 717 296"/>

  <rect class="tool" x="719" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="735" y="282">tool step</text>
  <text class="mono" x="735" y="306">delegate_to_</text>
  <text class="mono" x="735" y="326">analyst</text>
  <path class="step" d="M 893 296 L 922 296"/>

  <rect class="call" x="924" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="940" y="286">model call</text>
  <text class="mono" x="940" y="314">sees the result</text>
  <path class="step" d="M 1098 296 L 1127 296"/>

  <rect class="tool" x="1129" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="1145" y="286">tool step</text>
  <text class="mono" x="1145" y="314">summarise</text>
  <path class="step" d="M 1303 296 L 1332 296"/>

  <rect class="call" x="1334" y="256" width="172" height="80" rx="10"/>
  <text class="small" x="1350" y="286">model call</text>
  <text class="mono" x="1350" y="314">the answer</text>

  <!-- talk 2 -->
  <rect class="talk" x="84" y="380" width="1432" height="168" rx="12"/>
  <text class="label" x="104" y="412">Talk 2</text>
  <text class="body" x="180" y="412">"Write the report to reports/incident.md."</text>

  <rect class="call" x="104" y="436" width="150" height="80" rx="10"/>
  <text class="small" x="118" y="466">model call</text>
  <text class="mono" x="118" y="494">continues</text>
  <path class="step" d="M 256 476 L 277 476"/>

  <rect class="tool" x="279" y="436" width="150" height="80" rx="10"/>
  <text class="small" x="293" y="466">tool step</text>
  <text class="mono" x="293" y="494">write_report</text>
  <path class="step" d="M 431 476 L 452 476"/>

  <rect class="change" x="454" y="436" width="150" height="80" rx="10"/>
  <text class="small" x="468" y="462">change record</text>
  <text class="mono" x="468" y="486">incident.md</text>
  <text class="mono" x="468" y="506">+26 lines</text>
  <path class="step" d="M 606 476 L 627 476"/>

  <rect class="call" x="629" y="436" width="150" height="80" rx="10"/>
  <text class="small" x="643" y="466">model call</text>
  <text class="mono" x="643" y="494">the answer</text>

  <text class="body" x="900" y="468">Both talks share one thread;</text>
  <text class="body" x="900" y="496">Talk 2 continues Talk 1.</text>

  <!-- ===== child stream, under the tool step that starts it ===== -->
  <text class="column" x="60" y="626">CHILD STREAM  ·  the analyst, a sub-agent</text>
  <rect class="lane-child" x="60" y="640" width="1030" height="230" rx="16"/>
  <text class="body" x="84" y="676">Its own model context: the first call starts from the question it was handed,</text>
  <text class="body" x="84" y="700">not from the supervisor's history. The stream ends with the analyst's output,</text>
  <text class="body" x="84" y="724">and that output is the result of the delegate_to_analyst step.</text>

  <rect class="call" x="84" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="96" y="778">model call</text>
  <text class="mono" x="96" y="806">own prompt</text>
  <path class="step" d="M 232 788 L 250 788"/>

  <rect class="tool" x="252" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="264" y="778">tool step</text>
  <text class="mono" x="264" y="806">service_health</text>
  <path class="step" d="M 400 788 L 418 788"/>

  <rect class="call" x="420" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="432" y="778">model call</text>
  <text class="mono" x="432" y="806">sees it</text>
  <path class="step" d="M 568 788 L 586 788"/>

  <rect class="tool" x="588" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="600" y="778">tool step</text>
  <text class="mono" x="600" y="806">recent_logs</text>
  <path class="step" d="M 736 788 L 754 788"/>

  <rect class="call" x="756" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="768" y="778">model call</text>
  <text class="mono" x="768" y="806">the finding</text>
  <path class="step" d="M 904 788 L 922 788"/>

  <rect class="output" x="924" y="748" width="146" height="80" rx="10"/>
  <text class="small" x="936" y="778">agent output</text>
  <text class="mono" x="936" y="806">the result</text>

  <!-- ===== auxiliary stream, under the tool step that starts it ===== -->
  <text class="column" x="1310" y="626">AUXILIARY STREAM</text>
  <rect class="lane-aux" x="1130" y="640" width="410" height="230" rx="16"/>
  <rect class="call" x="1154" y="664" width="170" height="80" rx="10"/>
  <text class="small" x="1170" y="694">model call</text>
  <text class="mono" x="1170" y="722">one request</text>
  <text class="note" x="1154" y="778">Not a sub-agent. Its prompt does not</text>
  <text class="note" x="1154" y="802">continue the caller's, so it is kept</text>
  <text class="note" x="1154" y="826">out of the continuity check between</text>
  <text class="note" x="1154" y="850">the supervisor's calls.</text>

  <!-- ===== legend ===== -->
  <rect class="call" x="60" y="900" width="22" height="22" rx="4"/>
  <text class="body" x="92" y="918">model call</text>
  <rect class="tool" x="230" y="900" width="22" height="22" rx="4"/>
  <text class="body" x="262" y="918">tool step</text>
  <rect class="change" x="380" y="900" width="22" height="22" rx="4"/>
  <text class="body" x="412" y="918">change record</text>
  <rect class="output" x="580" y="900" width="22" height="22" rx="4"/>
  <text class="body" x="612" y="918">agent output</text>
  <line x1="770" y1="911" x2="802" y2="911" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="11 7"/>
  <text class="body" x="812" y="918">how the streams connect</text>

  <!-- ===== how the streams connect, drawn last so nothing covers the lines ===== -->
  <!-- delegate_to_analyst starts the child stream -->
  <path class="rel" d="M 805 338 L 805 638"/>
  <text class="rel-label" x="739" y="592">starts</text>
  <!-- the analyst's output is the result of the call that started it: the way back -->
  <path class="rel" d="M 1058 746 L 1058 610 L 860 610 L 860 340"/>
  <text class="rel-label" x="872" y="592">result_of</text>
  <!-- the child stream ends_with the analyst's output: a mark on the step, not a flow between two -->
  <rect x="930" y="735" width="116" height="24" rx="12" fill="#071423" stroke="#2dd4bf" stroke-width="2"/>
  <text class="rel-label" x="943" y="752">ends_with</text>
  <!-- summarise starts an auxiliary stream for its one plain model call -->
  <path class="rel-soft" d="M 1215 338 L 1215 638"/>
  <text class="aux-label" x="1150" y="592">starts</text>
  <!-- and the call's reply is the result of summarise -->
  <path class="rel-soft" d="M 1290 662 L 1290 340"/>
  <text class="aux-label" x="1302" y="592">result_of</text>
</svg>
