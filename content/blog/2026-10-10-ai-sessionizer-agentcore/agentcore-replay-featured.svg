<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="hero-title">Recorded while running. Kept when it ends.</title>
  <desc id="hero-desc">One continuous AI Sessionizer record spans two execution environments of one Amazon Bedrock AgentCore session. Five turns run in the first environment with local history and a repository clone. The fifth turn owns the retained file diff. After fifteen idle minutes, the first environment stops and its local state ends. Turn six runs in a fresh a new environment with empty memory and no repository clone. Sessionizer retains all six turns and the file diff. Solid upward arrows show the LangSmith wire; the dashed purple arrow records the fifth turn's file changes through asz-changes and shared EFS. Turn symbols are unnumbered and spacing is schematic.</desc>
  <defs>
    <marker id="hero-trace-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#4f46e5"/></marker>
    <marker id="hero-file-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#695aa1"/></marker>
    <g id="hero-turn" fill="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-19-26H19Q32-26 32-13V13Q32 26 19 26H-7L-21 35V26Q-32 26-32 13V-13Q-32-26-19-26Z"/>
      <path d="M-15-7H15M-15 7H6" fill="none"/>
    </g>
    <clipPath id="hero-vm1-clip"><rect x="80" y="542" width="1020" height="224" rx="20"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="130" font-size="64" font-weight="600" fill="#0f172a" data-box="80 66 1370 82">Recorded while running.</text>
  <text x="80" y="208" font-size="64" font-weight="600" fill="#065f46" data-box="80 144 1370 82">Kept when it ends.</text>

  <!-- The retained track is unbroken across the stop and the fresh runtime. -->
  <rect x="80" y="256" width="1440" height="232" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="112" y="305" font-size="38" font-weight="600" fill="#065f46" data-box="112 267 560 49">Apache SkyWalking AI Sessionizer</text>
  <text x="1488" y="305" text-anchor="end" font-size="32" fill="#065f46" data-box="1008 273 480 42">One continuous record</text>
  <path d="M128 350H1480" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#059669">
    <use href="#hero-turn" transform="translate(168 350)"/>
    <use href="#hero-turn" transform="translate(308 350)"/>
    <use href="#hero-turn" transform="translate(448 350)"/>
    <use href="#hero-turn" transform="translate(588 350)"/>
    <use href="#hero-turn" transform="translate(728 350)"/>
    <use href="#hero-turn" transform="translate(1360 350)"/>
  </g>
  <text x="1016" y="449" font-size="32" fill="#4c1d95">file changes</text>
  <text x="112" y="449" font-size="32" fill="#065f46" data-box="112 417 480 42">Prompts + tool calls</text>

  <!-- Only the fifth recorded turn owns this diff card. -->
  <path d="M728 385V405" fill="none" stroke="#695aa1" stroke-width="3"/>
  <rect x="690" y="405" width="300" height="62" rx="12" fill="#f5f3ff" stroke="#695aa1" stroke-width="2.5"/>
  <g fill="none" stroke="#695aa1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M712 418H733L744 429V454H712ZM733 418V429H744"/>
    <path d="M765 425H777M771 419V431M794 425H963M765 447H777M794 447H933"/>
  </g>

  <!-- Separate runtime lifetimes: the first ends; the second begins empty. -->
  <rect x="80" y="542" width="1020" height="224" rx="20" fill="#fff7ed"/>
  <rect x="832" y="542" width="268" height="224" fill="#f1f5f9" clip-path="url(#hero-vm1-clip)"/>
  <rect x="80" y="542" width="1020" height="224" rx="20" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="112" y="585" font-size="32" font-weight="600" fill="#9a3412" data-box="112 553 450 42">Amazon Bedrock AgentCore Runtime</text>
  
  <path d="M128 632H832" fill="none" stroke="#ea580c" stroke-width="3"/>
  <path d="M832 632H1100" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="1200" y="542" width="320" height="224" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="1232" y="585" font-size="32" font-weight="600" fill="#334155" data-box="1232 553 256 42">Same session</text>

  <!-- Six solid trace paths, plus the fifth turn's dashed file path. -->
  <g fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#hero-trace-arrow)">
    <path d="M168 541V491"/><path d="M308 541V491"/><path d="M448 541V491"/>
    <path d="M588 541V491"/><path d="M728 541V491"/><path d="M1360 541V491"/>
  </g>
  <path d="M760 632H804V469" fill="none" stroke="#695aa1" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round" marker-end="url(#hero-file-arrow)"/>
  <g stroke="#ea580c">
    <use href="#hero-turn" transform="translate(168 632)"/>
    <use href="#hero-turn" transform="translate(308 632)"/>
    <use href="#hero-turn" transform="translate(448 632)"/>
    <use href="#hero-turn" transform="translate(588 632)"/>
    <use href="#hero-turn" transform="translate(728 632)"/>
    <use href="#hero-turn" transform="translate(1360 632)"/>
  </g>

  <!-- The memory stack and working clone are local to the session's first environment. -->
  <g fill="#ffffff" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round">
    <rect x="112" y="695" width="45" height="14" rx="3"/>
    <rect x="112" y="712" width="45" height="14" rx="3"/>
    <rect x="112" y="729" width="45" height="14" rx="3"/>
    <path d="M354 743V701H376L384 710H406V743Z"/>
  </g>
  <text x="177" y="732" font-size="32" fill="#9a3412" data-box="177 700 150 42">History</text>
  <text x="426" y="732" font-size="32" fill="#9a3412" data-box="426 700 210 42">Repo clone</text>
  <path d="M728 667V697M714 697H732L742 707V735H714ZM732 697V707H742M721 716H735M728 709V723" fill="none" stroke="#695aa1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- The idle clock leads into a hard stop; no runtime line crosses it. -->
  <text x="966" y="585" text-anchor="middle" font-size="32" fill="#475569" data-box="864 553 204 42">15 min idle</text>
  <circle cx="966" cy="632" r="26" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <path d="M966 616V632L980 640" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1100 528V766" fill="none" stroke="#475569" stroke-width="5"/>
  <rect x="1090" y="622" width="20" height="20" rx="2" fill="#475569"/>
  <text x="966" y="732" text-anchor="middle" font-size="32" font-weight="600" fill="#475569" data-box="864 700 204 42">Stopped</text>
  <text x="1232" y="698" font-size="32" fill="#334155" data-box="1232 672 256 42">Starts without</text>
  <text x="1232" y="744" font-size="32" fill="#334155" data-box="1232 709 256 42">history or clone</text>

  <!-- Recording-path colors and line styles match the architecture figure. -->
  <path d="M96 818V790" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#hero-trace-arrow)"/>
  <text x="120" y="812" font-size="32" fill="#3730a3" data-box="120 780 275 40">LangSmith wire</text>
  <path d="M458 818V790" fill="none" stroke="#695aa1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#hero-file-arrow)"/>
  <text x="482" y="812" font-size="32" fill="#5b21b6" data-box="482 780 500 40">asz-changes → shared EFS</text>
</svg>
