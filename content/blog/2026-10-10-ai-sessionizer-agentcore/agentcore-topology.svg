<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t1 d1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20">
  <title id="t1">A LangGraph agent on Amazon Bedrock AgentCore Runtime, recorded by Apache SkyWalking AI Sessionizer</title>
  <desc id="d1">The caller invokes the agent on AgentCore Runtime with a session id. The runtime's network interfaces sit in private subnets. The agent sends the LangSmith wire to an internal load balancer in front of AI Sessionizer on ECS Fargate, and asz-changes in the agent writes what its tools changed to an Amazon EFS directory that Sessionizer also reads. The agent calls Amazon Nova Pro on Bedrock through a NAT gateway in a public subnet. You open the replay page through a public load balancer that only your IP may reach.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#695aa1"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- VPC and its subnets -->
  <rect x="240" y="20" width="940" height="670" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="262" y="56" font-size="22" font-weight="600" fill="#334155">VPC</text>
  <rect x="258" y="74" width="904" height="436" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="1148" y="100" font-size="20" text-anchor="end" fill="#64748b">private subnets</text>
  <rect x="258" y="528" width="904" height="146" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="1148" y="554" font-size="20" text-anchor="end" fill="#64748b">public subnets</text>

  <!-- AgentCore Runtime and the agent -->
  <rect x="276" y="112" width="380" height="250" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="296" y="146" font-size="22" font-weight="600" fill="#9a3412">Bedrock AgentCore Runtime</text>
  <text x="296" y="174" fill="#7c2d12">one environment per session,</text>
  <text x="296" y="200" fill="#7c2d12">ENIs in these subnets</text>
  <rect x="296" y="214" width="340" height="132" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="314" y="246" font-size="22" font-weight="600" fill="#1e293b">LangGraph agent</text>
  <text x="314" y="278" fill="#334155">langsmith client, 4 env vars</text>
  <text x="314" y="308" fill="#334155">asz-changes → /mnt/changes</text>
  <text x="314" y="336" fill="#64748b">repo clone in the session</text>

  <!-- internal load balancer -->
  <rect x="790" y="112" width="350" height="86" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="810" y="146" font-size="22" font-weight="600" fill="#3730a3">Internal LB :1985</text>
  <text x="810" y="178" fill="#3730a3">agent's security group only</text>

  <!-- Sessionizer -->
  <rect x="790" y="256" width="350" height="216" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="810" y="292" font-size="24" font-weight="600" fill="#065f46">AI Sessionizer</text>
  <text x="810" y="320" fill="#065f46">on ECS Fargate, one task</text>
  <text x="810" y="358" fill="#065f46">LangSmith receiver, token</text>
  <text x="810" y="388" fill="#065f46">changes: /asz/changes</text>
  <text x="810" y="418" fill="#065f46">conversation assembly</text>
  <text x="810" y="448" fill="#065f46">replay page :8787</text>

  <!-- EFS -->
  <rect x="452" y="392" width="270" height="104" rx="12" fill="#f5f3ff" stroke="#695aa1" stroke-width="2"/>
  <text x="472" y="426" font-size="22" font-weight="600" fill="#4c1d95">Amazon EFS</text>
  <text x="472" y="456" fill="#4c1d95">/asz-changes, shared</text>
  <text x="472" y="484" fill="#4c1d95">/asz-data, Sessionizer</text>

  <!-- NAT and public load balancer -->
  <rect x="276" y="572" width="300" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="296" y="606" font-size="22" font-weight="600" fill="#334155">NAT gateway</text>
  <text x="296" y="638" fill="#334155">Bedrock, image pulls</text>
  <rect x="790" y="572" width="350" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="810" y="606" font-size="22" font-weight="600" fill="#334155">Public LB :8787</text>
  <text x="810" y="638" fill="#334155">your IP only</text>

  <!-- outside the VPC -->
  <rect x="20" y="166" width="196" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="38" y="200" font-size="22" font-weight="600" fill="#1e293b">Caller</text>
  <text x="38" y="232" fill="#334155">session id</text>
  <rect x="20" y="572" width="196" height="88" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="38" y="606" font-size="21" font-weight="600" fill="#9a3412">Amazon Bedrock</text>
  <text x="38" y="638" fill="#9a3412">Nova Pro</text>
  <rect x="790" y="702" width="350" height="62" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="810" y="741" font-size="22" font-weight="600" fill="#1e293b">You, in a browser</text>

  <!-- arrows -->
  <line x1="216" y1="210" x2="270" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="636" y1="252" x2="784" y2="166" stroke="#4f46e5" stroke-width="3" marker-end="url(#ab)"/>
  <text x="664" y="262" fill="#3730a3" font-size="20">LangSmith</text>
  <text x="664" y="286" fill="#3730a3" font-size="20">wire</text>
  <line x1="965" y1="198" x2="965" y2="250" stroke="#4f46e5" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="560" y1="362" x2="560" y2="388" stroke="#695aa1" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="572" y="384" fill="#4c1d95" font-size="20">file changes</text>
  <line x1="722" y1="444" x2="784" y2="420" stroke="#695aa1" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <line x1="330" y1="362" x2="330" y2="566" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="276" y1="616" x2="222" y2="616" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="965" y1="572" x2="965" y2="478" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="965" y1="702" x2="965" y2="666" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
