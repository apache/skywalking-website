<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="timeline-title timeline-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="timeline-title">One conversation across two execution environments of one AgentCore session</title>
  <desc id="timeline-desc">Turns one through five run in the first execution environment of an Amazon Bedrock AgentCore session and are recorded during execution. Turn five changes terraform.tfvars and owns the diff retained by AI Sessionizer. After fifteen idle minutes, the first environment stops and its local history and repository clone disappear. Turn six starts with empty memory and no repository clone in a fresh a new environment using the same session ID. One unbroken Sessionizer track retains all six turns, their prompts and tool calls, and the fifth turn's terraform.tfvars diff. Solid upward arrows represent the LangSmith wire; the dashed purple arrow connects turn five to its diff through asz-changes and shared EFS. Horizontal spacing is schematic.</desc>
  <defs>
    <marker id="timeline-trace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#4f46e5"/></marker>
    <marker id="timeline-file-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#695aa1"/></marker>
    <clipPath id="timeline-vm1-clip"><rect x="32" y="302" width="808" height="156" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="32" y="34" font-size="28" font-weight="600" fill="#0f172a" data-box="32 6 900 36">Same session ID throughout</text>

  <!-- This track crosses the idle interval and stop without a break. -->
  <rect x="32" y="52" width="1136" height="178" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="56" y="87" font-size="26" font-weight="600" fill="#065f46" data-box="56 61 540 34">AI Sessionizer · one conversation</text>
  <text x="1144" y="87" text-anchor="end" font-size="24" fill="#065f46" data-box="740 63 404 32">Earlier turns and diff kept</text>
  <path d="M80 125H1138" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#059669" stroke-width="3">
    <circle cx="112" cy="125" r="19"/>
    <circle cx="212" cy="125" r="19"/>
    <circle cx="312" cy="125" r="19"/>
    <circle cx="412" cy="125" r="19"/>
    <circle cx="512" cy="125" r="19"/>
    <circle cx="1048" cy="125" r="19"/>
  </g>
  <g text-anchor="middle" font-size="24" fill="#065f46">
    <text x="112" y="133" data-box="98 109 28 30">1</text>
    <text x="212" y="133" data-box="198 109 28 30">2</text>
    <text x="312" y="133" data-box="298 109 28 30">3</text>
    <text x="412" y="133" data-box="398 109 28 30">4</text>
    <text x="512" y="133" data-box="498 109 28 30">5</text>
    <text x="1048" y="133" data-box="1034 109 28 30">6</text>
  </g>

  <!-- A leader from recorded turn five makes diff ownership explicit. -->
  <path d="M512 145V162" fill="none" stroke="#695aa1" stroke-width="2.5"/>
  <rect x="448" y="162" width="380" height="46" rx="12" fill="#f5f3ff" stroke="#695aa1" stroke-width="2"/>
  <text x="468" y="193" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" fill="#5b21b6" data-box="468 169 340 32">terraform.tfvars diff</text>
  <text x="56" y="184" font-size="24" fill="#065f46" data-box="56 160 364 62"><tspan x="56" y="184">Prompts and tool calls</tspan><tspan x="56" y="214">retained</tspan></text>
  <text x="1048" y="191" text-anchor="middle" font-size="24" fill="#065f46" data-box="948 167 200 32">Turn 6, +16 min</text>

  <!-- The first runtime owns its history and clone, then terminates. -->
  <rect x="32" y="302" width="808" height="156" rx="14" fill="#fff7ed"/>
  <rect x="584" y="302" width="256" height="156" fill="#f1f5f9" clip-path="url(#timeline-vm1-clip)"/>
  <rect x="32" y="302" width="808" height="156" rx="14" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="56" y="333" font-size="26" font-weight="600" fill="#9a3412" data-box="56 307 330 34">AgentCore Runtime session</text>
  <path d="M80 369H584" fill="none" stroke="#ea580c" stroke-width="3"/>
  <path d="M584 369H840" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="56" y="411" font-size="24" fill="#9a3412" data-box="56 387 340 32">History + repo clone</text>
  <text x="56" y="445" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" fill="#9a3412" data-box="56 421 340 32">terraform.tfvars</text>
  <text x="712" y="333" text-anchor="middle" font-size="24" fill="#475569" data-box="608 309 208 32">15 min idle timeout</text>
  <text x="840" y="278" text-anchor="end" font-size="24" font-weight="600" fill="#475569" data-box="592 254 248 32">environment stopped</text>
  <path d="M840 287V458" fill="none" stroke="#475569" stroke-width="4"/>
  <rect x="833" y="362" width="14" height="14" rx="1" fill="#475569"/>

  <!-- Turn six starts in a separate, empty runtime. -->
  <rect x="920" y="302" width="248" height="156" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <text x="944" y="333" font-size="26" font-weight="600" fill="#334155" data-box="944 307 200 34">Same session</text>
  <text x="944" y="411" font-size="24" fill="#334155" data-box="944 387 200 32">Starts without</text>
  <text x="944" y="445" font-size="24" fill="#334155" data-box="944 421 200 32">history or clone</text>

  <!-- Upward recording paths. The dashed file path starts at turn five. -->
  <g fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#timeline-trace-arrow)">
    <path d="M112 301V233"/><path d="M212 301V233"/><path d="M312 301V233"/>
    <path d="M412 301V233"/><path d="M512 301V233"/><path d="M1048 301V233"/>
  </g>
  <path d="M531 369H560V210" fill="none" stroke="#695aa1" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#timeline-file-arrow)"/>
  <g fill="#ffffff" stroke="#ea580c" stroke-width="3">
    <circle cx="112" cy="369" r="19"/>
    <circle cx="212" cy="369" r="19"/>
    <circle cx="312" cy="369" r="19"/>
    <circle cx="412" cy="369" r="19"/>
    <circle cx="512" cy="369" r="19"/>
    <circle cx="1048" cy="369" r="19"/>
  </g>
  <g text-anchor="middle" font-size="24" fill="#9a3412">
    <text x="112" y="377" data-box="98 353 28 30">1</text>
    <text x="212" y="377" data-box="198 353 28 30">2</text>
    <text x="312" y="377" data-box="298 353 28 30">3</text>
    <text x="412" y="377" data-box="398 353 28 30">4</text>
    <text x="512" y="377" data-box="498 353 28 30">5</text>
    <text x="1048" y="377" data-box="1034 353 28 30">6</text>
  </g>

  <path d="M56 507V480" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#timeline-trace-arrow)"/>
  <text x="74" y="502" font-size="24" fill="#3730a3" data-box="74 478 196 32">LangSmith wire</text>
  <path d="M284 507V480" fill="none" stroke="#695aa1" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#timeline-file-arrow)"/>
  <text x="302" y="502" font-size="24" fill="#5b21b6" data-box="302 478 400 32">asz-changes → shared EFS</text>
  <text x="1144" y="502" text-anchor="end" font-size="24" fill="#475569" data-box="820 478 324 32">Recorded while running</text>
</svg>
