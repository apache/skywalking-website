<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From native evidence to one durable conversation</title>
  <desc id="desc">Claude Code main transcripts, child transcripts, workflow journals, manifests, and scripts flow through an indexed eight-stage assembly pipeline. The result is a conversation with source provenance, separate main and child execution streams, context epochs, talks, runs, steps, and a Segment grouping several—but not necessarily all—Talks from one fetching period. Exact, inferred, and unresolved relationships remain distinguishable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70b7ff"/>
    </marker>
    <style>
      .bg { fill: #071423; }
      .panel { fill: #0d1d2d; stroke: #2b435b; stroke-width: 2; }
      .panel-soft { fill: #102438; stroke: #35516d; stroke-width: 2; }
      .title { fill: #f2f7fc; font: 500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .column { fill: #90a8be; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .label { fill: #f2f7fc; font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #c0cfdd; font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #91a7bb; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #b8c8d7; font: 400 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step-no { fill: #70b7ff; font: 500 17px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow { fill: none; stroke: #70b7ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .source-line { fill: none; stroke: #42627f; stroke-width: 2; }
      .stream-main { fill: #102b38; stroke: #2dd4bf; stroke-width: 2; }
      .stream-child { fill: #221f3c; stroke: #a78bfa; stroke-width: 2; }
      .talk { fill: #16374a; stroke: #4f7998; stroke-width: 1.5; }
      .talk-child { fill: #332b58; stroke: #695aa1; stroke-width: 1.5; }
      .segment { fill: #f5a742; fill-opacity: .10; stroke: #f5a742; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .exact { stroke: #8fc5ff; stroke-width: 2.5; }
      .inferred { stroke: #f5b942; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .unresolved { stroke: #91a7bb; stroke-width: 2.5; stroke-dasharray: 3 7; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" rx="24"/>
  <text class="title" x="60" y="64">From native evidence to one durable conversation</text>

  <text class="column" x="60" y="125">NATIVE EVIDENCE</text>
  <text class="column" x="565" y="125">EVIDENCE-BASED ASSEMBLY</text>
  <text class="column" x="1150" y="125">COMMITTED SESSION MODEL</text>

  <!-- Native evidence -->
  <g transform="translate(60 165)">
    <rect class="panel" width="390" height="92" rx="12"/>
    <path d="M24 22h28l12 12v35H24z M52 22v13h12" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text class="label" x="82" y="40">Main transcript</text>
    <text class="small" x="82" y="68">messages · model fragments · tools</text>
  </g>
  <g transform="translate(60 278)">
    <rect class="panel" width="390" height="92" rx="12"/>
    <path d="M24 22h28l12 12v35H24z M52 22v13h12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="82" y="40">Child-agent records</text>
    <text class="small" x="82" y="68">transcripts · metadata · output</text>
  </g>
  <g transform="translate(60 391)">
    <rect class="panel" width="390" height="92" rx="12"/>
    <path d="M24 22h28l12 12v35H24z M52 22v13h12" fill="none" stroke="#f5a742" stroke-width="2"/>
    <text class="label" x="82" y="40">Workflow journals</text>
    <text class="small" x="82" y="68">starts · completions · run identity</text>
  </g>
  <g transform="translate(60 504)">
    <rect class="panel" width="390" height="92" rx="12"/>
    <path d="M24 22h28l12 12v35H24z M52 22v13h12" fill="none" stroke="#70b7ff" stroke-width="2"/>
    <text class="label" x="82" y="40">Manifests and scripts</text>
    <text class="small" x="82" y="68">runtime context · source provenance</text>
  </g>
  <text class="body" x="60" y="645">Read from files already on disk</text>
  <text class="small" x="60" y="674">No Claude Code plugin, hook, or wrapper</text>

  <!-- Evidence convergence -->
  <path class="source-line" d="M450 211 H490 V437"/>
  <path class="source-line" d="M450 324 H490"/>
  <path class="source-line" d="M450 437 H490"/>
  <path class="source-line" d="M450 550 H490 V437"/>
  <path class="flow" d="M490 437 H545"/>

  <!-- Assembly pipeline -->
  <rect class="panel-soft" x="545" y="155" width="510" height="110" rx="14"/>
  <text class="label" x="575" y="194">Runtime-neutral Session Data</text>
  <text class="body" x="575" y="226">session · stream · identity · parent · call · run</text>
  <text class="tiny" x="575" y="251">tool · child · trigger · source refs (seq · row · block)</text>

  <rect class="panel" x="545" y="286" width="510" height="409" rx="14"/>
  <g>
    <text class="step-no" x="574" y="329">01</text><text class="body" x="624" y="329">Remove duplicate records</text>
    <line x1="574" y1="348" x2="1026" y2="348" stroke="#243c53"/>
    <text class="step-no" x="574" y="374">02</text><text class="body" x="624" y="374">Partition independent execution streams</text>
    <line x1="574" y1="393" x2="1026" y2="393" stroke="#243c53"/>
    <text class="step-no" x="574" y="419">03</text><text class="body" x="624" y="419">Group provider fragments into model calls</text>
    <line x1="574" y1="438" x2="1026" y2="438" stroke="#243c53"/>
    <text class="step-no" x="574" y="464">04</text><text class="body" x="624" y="464">Join each tool request with its result</text>
    <line x1="574" y1="483" x2="1026" y2="483" stroke="#243c53"/>
    <text class="step-no" x="574" y="509">05</text><text class="body" x="624" y="509">Link agent calls to child streams</text>
    <line x1="574" y1="528" x2="1026" y2="528" stroke="#243c53"/>
    <text class="step-no" x="574" y="554">06</text><text class="body" x="624" y="554">Cut context epochs at explicit resets</text>
    <line x1="574" y1="573" x2="1026" y2="573" stroke="#243c53"/>
    <text class="step-no" x="574" y="599">07</text><text class="body" x="624" y="599">Build readable Talks and Runs</text>
    <line x1="574" y1="618" x2="1026" y2="618" stroke="#243c53"/>
    <text class="step-no" x="574" y="644">08</text><text class="body" x="624" y="644">Group several fetched Talks into a Segment</text>
  </g>
  <rect x="545" y="716" width="510" height="62" rx="12" fill="#0c2630" stroke="#2a746f" stroke-width="2"/>
  <text class="body" x="575" y="754">Every join keeps its evidence and quality</text>

  <path class="flow" d="M1055 437 H1125"/>

  <!-- Committed model -->
  <rect class="panel-soft" x="1125" y="155" width="420" height="623" rx="16"/>
  <text class="label" x="1155" y="195">Conversation C1</text>
  <text class="small" x="1155" y="224">durable identity · append-only rounds</text>

  <rect x="1155" y="246" width="360" height="49" rx="9" fill="#142c41" stroke="#476784" stroke-width="1.5"/>
  <text class="body" x="1175" y="278">Session S1 · source provenance</text>

  <rect class="stream-main" x="1155" y="320" width="360" height="177" rx="12"/>
  <text class="label" x="1178" y="355">Main execution stream</text>
  <text class="small" x="1178" y="383">Context epoch 1</text>
  <rect class="talk" x="1178" y="405" width="92" height="58" rx="8"/>
  <rect class="talk" x="1280" y="405" width="92" height="58" rx="8"/>
  <rect class="talk" x="1382" y="405" width="105" height="58" rx="8"/>
  <text class="small" x="1197" y="440">Talk 1</text>
  <text class="small" x="1299" y="440">Talk 2</text>
  <text class="small" x="1401" y="440">Talk 3</text>

  <rect class="stream-child" x="1155" y="522" width="360" height="136" rx="12"/>
  <text class="label" x="1178" y="557">Child execution stream</text>
  <text class="small" x="1178" y="585">Independent context and ownership</text>
  <rect class="talk-child" x="1178" y="603" width="88" height="34" rx="7"/>
  <rect class="talk-child" x="1280" y="603" width="207" height="34" rx="7"/>
  <text class="small" x="1194" y="626">Talk A</text>
  <text class="small" x="1355" y="626">Talk B</text>

  <rect class="segment" x="1270" y="392" width="228" height="260" rx="10"/>

  <rect x="1155" y="694" width="230" height="51" rx="10" fill="#101f2e" stroke="#5b6f82" stroke-dasharray="4 6"/>
  <text class="small" x="1174" y="725">? unresolved record retained</text>
  <text class="tiny" x="1401" y="714">source refs</text>
  <text class="tiny" x="1401" y="735">seq · row · block</text>

  <!-- Legend -->
  <g transform="translate(60 838)">
    <line class="exact" x1="0" y1="0" x2="72" y2="0"/><text class="small" x="86" y="6">exact_unique</text>
    <line class="inferred" x1="270" y1="0" x2="342" y2="0"/><text class="small" x="356" y="6">inference</text>
    <line class="unresolved" x1="535" y1="0" x2="607" y2="0"/><text class="small" x="621" y="6">unresolved</text>
    <rect class="segment" x="850" y="-15" width="46" height="30" rx="5"/>
    <text class="small" x="912" y="6">Segment = several Talks within a fetching period</text>
  </g>
</svg>
