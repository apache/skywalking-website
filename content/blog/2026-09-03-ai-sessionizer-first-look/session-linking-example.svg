<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">A Segment groups several Talks from a fetching period</title>
  <desc id="desc">One fetching period contains four Talks. A Segment inside that period groups Talk 12 and Talk 13, while Talk 11 and Talk 14 remain outside the Segment. Talk 12 is expanded below to show two main-agent Runs connected to an independent child-agent stream. Exact, inferred, and unresolved relationships are visibly distinct.</desc>
  <defs>
    <marker id="neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58738d"/>
    </marker>
    <marker id="exact-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fc5ff"/>
    </marker>
    <marker id="inferred-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f5b942"/>
    </marker>
    <style>
      .bg { fill: #071423; }
      .title { fill: #f2f7fc; font: 500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #dce8f2; font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .label { fill: #f2f7fc; font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #c0cfdd; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #91a7bb; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #b8c8d7; font: 400 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .talk { fill: #0c1d2d; stroke: #2dd4bf; stroke-width: 2.5; }
      .epoch { fill: #f472b6; fill-opacity: .035; stroke: #a94e82; stroke-width: 1.5; stroke-dasharray: 8 7; }
      .run { fill: #0b1725; stroke: #35516d; stroke-width: 2; }
      .input { fill: #11382f; stroke: #32d583; stroke-width: 2; }
      .response { fill: #10353a; stroke: #2dd4bf; stroke-width: 2; }
      .model { fill: #152e49; stroke: #58a6ff; stroke-width: 2; }
      .tool { fill: #3b2d1b; stroke: #f5a742; stroke-width: 2; }
      .agent { fill: #292144; stroke: #a78bfa; stroke-width: 2; }
      .context { fill: #3b2034; stroke: #f472b6; stroke-width: 1.5; }
      .child { fill: #17162d; stroke: #a78bfa; stroke-width: 2.5; }
      .orphan { fill: #101f2e; stroke: #71869a; stroke-width: 2; stroke-dasharray: 4 7; }
      .fetch { fill: #10202f; stroke: #45637e; stroke-width: 2; }
      .segment { fill: #f5a742; fill-opacity: .06; stroke: #f5a742; stroke-width: 2; stroke-dasharray: 8 7; }
      .segment-talk { fill: #14283a; stroke: #45637e; stroke-width: 1.5; }
      .segment-talk-selected { fill: #12343a; stroke: #2dd4bf; stroke-width: 2; }
      .order { fill: none; stroke: #58738d; stroke-width: 2; marker-end: url(#neutral-arrow); }
      .exact { fill: none; stroke: #8fc5ff; stroke-width: 2.5; marker-end: url(#exact-arrow); }
      .inferred { fill: none; stroke: #f5b942; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#inferred-arrow); }
      .unresolved { fill: none; stroke: #91a7bb; stroke-width: 2.5; stroke-dasharray: 3 7; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040" rx="24"/>
  <text class="title" x="60" y="64">A Segment groups several Talks from a fetching period</text>

  <!-- One fetching period; its Segment contains only some of the Talks -->
  <rect class="fetch" x="60" y="100" width="1480" height="170" rx="15"/>
  <text class="section" x="88" y="135">ONE FETCHING PERIOD</text>
  <text class="small" x="1280" y="135">4 Talks fetched</text>
  <text class="small" x="88" y="198">fetch start</text>
  <text class="small" x="1431" y="198">fetch end</text>

  <rect class="segment" x="470" y="142" width="640" height="113" rx="12"/>
  <text x="490" y="168" fill="#f7c56d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="500">SEGMENT 3 · 2 OF 4 TALKS</text>

  <rect class="segment-talk" x="150" y="184" width="250" height="56" rx="9"/>
  <text class="body" x="240" y="218">Talk 11</text>
  <rect class="segment-talk-selected" x="495" y="184" width="275" height="56" rx="9"/>
  <text class="body" x="545" y="218">Talk 12 · expanded below</text>
  <rect class="segment-talk" x="805" y="184" width="275" height="56" rx="9"/>
  <text class="body" x="895" y="218">Talk 13</text>
  <rect class="segment-talk" x="1150" y="184" width="250" height="56" rx="9"/>
  <text class="body" x="1240" y="218">Talk 14</text>
  <path class="order" d="M632 240V282"/>

  <!-- Main talk and epoch -->
  <g transform="translate(0 190)">
  <rect class="talk" x="60" y="108" width="1480" height="386" rx="17"/>
  <text class="section" x="90" y="148">MAIN EXECUTION STREAM · TALK 12</text>
  <text class="small" x="1255" y="148">one readable interaction</text>

  <rect class="epoch" x="85" y="172" width="1430" height="294" rx="13"/>
  <text x="1240" y="202" fill="#e986b9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">CONTEXT EPOCH 1</text>

  <rect class="input" x="112" y="291" width="176" height="92" rx="12"/>
  <text class="label" x="132" y="328">External input</text>
  <text class="small" x="132" y="356">starts the Talk</text>

  <rect class="run" x="327" y="222" width="620" height="211" rx="14"/>
  <text class="section" x="350" y="256">RUN P1 · EXTERNAL TRIGGER</text>

  <rect class="run" x="980" y="222" width="329" height="211" rx="14"/>
  <text class="section" x="1002" y="256">RUN P2 · NOTIFICATION</text>

  <rect class="context" x="367" y="274" width="144" height="33" rx="8"/>
  <text class="small" x="384" y="296">context injection</text>
  <path class="inferred" d="M439 307V321"/>

  <rect class="model" x="367" y="322" width="144" height="78" rx="10"/>
  <text class="label" x="391" y="352">LLM call</text>
  <text class="mono" x="385" y="379">message ID</text>

  <rect class="tool" x="547" y="322" width="170" height="78" rx="10"/>
  <text class="label" x="573" y="351">Tool step</text>
  <text class="small" x="568" y="376">request + result</text>
  <text class="mono" x="584" y="396">tool-use ID</text>

  <rect class="agent" x="753" y="322" width="168" height="78" rx="10"/>
  <text class="label" x="779" y="351">Agent call</text>
  <text class="small" x="778" y="376">delegate work</text>
  <text class="mono" x="784" y="396">agent/run ID</text>

  <rect class="agent" x="1001" y="322" width="170" height="78" rx="10"/>
  <text class="label" x="1018" y="351">Notification</text>
  <text class="small" x="1027" y="377">child completed</text>

  <rect class="model" x="1202" y="322" width="85" height="78" rx="10"/>
  <text class="label" x="1221" y="351">LLM</text>
  <text class="small" x="1218" y="377">resume</text>

  <rect class="response" x="1344" y="291" width="166" height="92" rx="12"/>
  <text class="label" x="1364" y="328">Agent output</text>
  <text class="small" x="1364" y="356">readable response</text>

  <!-- Main stream order -->
  <path class="order" d="M288 337H327"/>
  <path class="order" d="M511 361H547"/>
  <path class="order" d="M717 361H753"/>
  <path class="order" d="M1171 361H1202"/>
  <path class="order" d="M1287 337H1344"/>

  <!-- Child stream -->
  <rect class="child" x="698" y="537" width="622" height="161" rx="15"/>
  <text class="section" x="725" y="573">CHILD EXECUTION STREAM</text>
  <text class="small" x="1065" y="573">independent context and ownership</text>

  <rect class="model" x="735" y="599" width="142" height="67" rx="10"/>
  <text class="label" x="760" y="628">Child LLM</text>
  <text class="small" x="769" y="651">model call</text>

  <rect class="tool" x="910" y="599" width="150" height="67" rx="10"/>
  <text class="label" x="934" y="628">Child tool</text>
  <text class="small" x="943" y="651">one step</text>

  <rect class="agent" x="1093" y="599" width="190" height="67" rx="10"/>
  <text class="label" x="1118" y="628">Agent output</text>
  <text class="small" x="1123" y="651">owned by child</text>

  <path class="order" d="M877 632H910"/>
  <path class="order" d="M1060 632H1093"/>

  <!-- Cross-stream relations -->
  <path class="exact" d="M837 400V510H760V537"/>
  <text x="773" y="502" fill="#9dceff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">starts · exact_unique</text>
  <path class="inferred" d="M1086 400V515H1188V537"/>
  <text x="1094" y="505" fill="#f7c56d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">reports · inference</text>

  <!-- Unresolved evidence -->
  <rect class="orphan" x="1362" y="563" width="150" height="94" rx="12"/>
  <text class="label" x="1424" y="600">?</text>
  <text class="small" x="1381" y="627">unresolved record</text>
  <path class="unresolved" d="M1320 615H1362"/>

  <!-- Time and legend -->
  <path d="M112 750H1510" fill="none" stroke="#35516d" stroke-width="2" marker-end="url(#neutral-arrow)"/>
  <text class="small" x="112" y="738">observed order within each stream</text>

  <g transform="translate(112 805)">
    <line x1="0" y1="0" x2="68" y2="0" stroke="#58738d" stroke-width="2"/><text class="small" x="82" y="6">stream order</text>
    <line x1="250" y1="0" x2="318" y2="0" stroke="#8fc5ff" stroke-width="2.5"/><text class="small" x="332" y="6">exact_unique relation</text>
    <line x1="595" y1="0" x2="663" y2="0" stroke="#f5b942" stroke-width="2.5" stroke-dasharray="10 7"/><text class="small" x="677" y="6">inferred relation</text>
    <line x1="900" y1="0" x2="968" y2="0" stroke="#91a7bb" stroke-width="2.5" stroke-dasharray="3 7"/><text class="small" x="982" y="6">unresolved evidence retained</text>
  </g>
  </g>
</svg>
