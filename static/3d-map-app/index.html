<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This is a trimmed, no-backend DEMO build of the SkyWalking Horizon UI
         3D infrastructure map, embedded on skywalking.apache.org. It renders a
         FROZEN snapshot captured once from the public demo OAP — it does not
         connect to, or monitor, any live system. Source:
         https://github.com/apache/skywalking-horizon-ui -->
    <meta name="robots" content="noindex" />
    <!-- Inter + JetBrains Mono are self-hosted via @fontsource-variable
         (imported in src/main.ts). The Google Fonts CDN dependency was
         removed so the UI renders the intended typography offline /
         behind firewalls without falling back to system fonts. -->
    <title>SkyWalking 3D Infrastructure Map — interactive demo</title>
    <script type="module" crossorigin src="./assets/index-CZkrbiDB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-J-7fjmqM.css">
    <!-- Injected by skywalking.apache.org: an exit affordance back to the
         marketing site, since this full-page demo has no site chrome of its
         own. Sits outside #app so the Vue mount never clobbers it. -->
    <style>
      #sw-exit{
        position:fixed; top:12px; left:50%; transform:translateX(-50%);
        z-index:2147483647; display:inline-flex; align-items:center; gap:7px;
        height:34px; padding:0 15px; border-radius:999px;
        font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
        color:#fff; background:rgba(15,19,26,.74);
        border:1px solid rgba(255,255,255,.32); cursor:pointer;
        box-shadow:0 6px 20px rgba(0,0,0,.35);
        -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
      }
      #sw-exit:hover{ background:rgba(15,19,26,.94); border-color:rgba(255,255,255,.55); }
      #sw-exit b{ font-size:15px; font-weight:700; line-height:1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="sw-exit" type="button" title="Back to the Apache SkyWalking website (Esc)"
            aria-label="Back to the Apache SkyWalking website"><b>&times;</b> Exit</button>
    <script>
      (function () {
        function exit() {
          var ref = document.referrer || '';
          if (window.history.length > 1 && ref.indexOf(window.location.origin) === 0) {
            window.history.back();
          } else {
            window.location.assign('/');
          }
        }
        document.getElementById('sw-exit').addEventListener('click', exit);
        window.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' || e.key === 'Esc') exit();
        });
      })();
    </script>
  </body>
</html>
