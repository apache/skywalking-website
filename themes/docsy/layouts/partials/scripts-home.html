<script>
  initBanner();
  openDemoDropdown();

  function initBanner() {
    $('.banner-nav li').click(function () {
      var index = $(this).index();
      $(this).addClass('active').siblings().removeClass('active');
      $('.banner-wrapper .img-item').eq(index).fadeIn().siblings().fadeOut();
    });
  }

  function openDemoDropdown() {
    if (location.hash !== '#demo') return;
    var $wrapper = $('.demo-wrapper');
    if (!$wrapper.length) return;
    // Visitors arriving via skywalking.apache.org/#demo should land with the
    // Live demo box already dropped open and the whole box highlighted.
    $wrapper.find('.dropdown-toggle').dropdown('show');
    $wrapper.addClass('demo-attention');
  }

  // Honour the deep link both on first load and on in-page hash changes.
  $(window).on('hashchange', openDemoDropdown);
</script>
