{{- /* Users / adopters logo wall. Data: data/users.yml */ -}}
<div class="users-wrapper">
  <div class="users-grid">
    {{ range .Site.Data.users.users }}
    <a class="users-logo" href="{{ .website }}" rel="noopener noreferrer" target="_blank" title="{{ .name }}{{ with .info }} — {{ . }}{{ end }}">
      <img loading="lazy" src="{{ .logo }}" alt="{{ .name }}" data-nolightbox="true">
    </a>
    {{ end }}
  </div>
  <p class="users-note">
    Using SkyWalking? Add your company or organization — send a pull request to
    <a target="_blank" rel="noopener" href="https://github.com/apache/skywalking-website/blob/master/data/users.yml">data/users.yml</a>.
  </p>
</div>
