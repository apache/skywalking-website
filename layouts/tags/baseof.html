<!doctype html>
<html lang="{{ partial "seo/lang.html" . }}" class="no-js">
  <head>
    {{ partial "head.html" . }}
    {{ partial "blog-topic-styles.html" . }}
  </head>
  <body class="td-{{ .Kind }} td-blog">
    <header>
      {{ partial "navbar.html" . }}
    </header>
    <div class="container-fluid td-outer">
      <main class="td-main" role="main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ partial "event-popup.html" . }}
    {{ partial "sidebar-skywalking.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
