{{- /* Emits one .blog-label[data-label="…"] rule per topic in
       data/blog_topics.yml. Include from any baseof that renders blog labels
       (blog/baseof.html, zh/baseof.html, tags/baseof.html). */ -}}
<style>
{{- range .Site.Data.blog_topics.topics -}}
.blog-label[data-label="{{ .name }}"]{background:{{ .color.bg }};color:{{ .color.fg }};border-color:{{ .color.border }};}
{{ end -}}
</style>
