<div class="project-release-files">
  {{ range . }}
  <div class="project-release-file">
    <a class="project-file-link" href="{{ .link }}" target="_blank" rel="noopener">{{ .name }} <span aria-hidden="true">↗</span></a>
    <span class="project-file-checks">
      {{ with .asc }}<a href="{{ . }}" target="_blank" rel="noopener" aria-label="PGP signature">PGP</a>{{ end }}
      {{ with .sha512 }}<a href="{{ . }}" target="_blank" rel="noopener" aria-label="SHA512 checksum">SHA512</a>{{ end }}
    </span>
  </div>
  {{ end }}
</div>
