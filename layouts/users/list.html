{{ define "main" }}
{{ $users := .Site.Data.users.users }}
<section class="users-hero">
  <div class="container">
    <div class="users-hero-grid">
      <div>
        <span class="eyebrow">USERS</span>
        <h1>Trusted in production worldwide</h1>
        <p>Companies and organizations across industries run Apache SkyWalking for research,
           production and commercial products.</p>
        <div class="users-cta">
          <a class="sky-btn primary" href="https://github.com/apache/skywalking-website/blob/master/data/users.yml" target="_blank" rel="noopener">Add your company →</a>
          <span class="users-count"><strong>{{ len $users }}</strong> organizations</span>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="container users-wrap">
  {{ .Content }}
</div>
{{ end }}
