<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The application does not change</title>
  <desc id="desc">A LangGraph application carries the LangSmith tracing client already. Four environment variables point that client at the Sessionizer receiver. The receiver lands Session Data, assembly builds the conversation, and the result is served on the local page or exported to SkyWalking. The change recorder adds what each tool call changed on disk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70b7ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .bg { fill: #071423; }
      .panel { fill: #0d1d2d; stroke: #2b435b; stroke-width: 2; }
      .panel-soft { fill: #102438; stroke: #35516d; stroke-width: 2; }
      .panel-accent { fill: #0c2630; stroke: #2a746f; stroke-width: 2; }
      .panel-purple { fill: #142c41; stroke: #a78bfa; stroke-width: 2; }
      .title { fill: #f2f7fc; font: 500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .column { fill: #90a8be; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .label { fill: #f2f7fc; font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #c0cfdd; font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #70b7ff; font: 400 18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .mono-soft { fill: #90a8be; font: 400 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .note { fill: #f5a742; font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { stroke: #70b7ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-purple { stroke: #a78bfa; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-purple); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="70">The application does not change</text>
  <text class="body" x="60" y="106">Your agent already carries the tracing client. Four environment variables point it at Sessionizer.</text>

  <!-- column headings -->
  <text class="column" x="60" y="170">YOUR AGENT</text>
  <text class="column" x="600" y="170">SESSIONIZER  ·  asz server</text>
  <text class="column" x="1140" y="170">WHERE YOU READ IT</text>

  <!-- your agent -->
  <rect class="panel" x="60" y="190" width="460" height="300" rx="14"/>
  <text class="label" x="88" y="232">LangGraph application</text>
  <text class="body" x="88" y="274">your model, on Amazon Bedrock</text>
  <text class="body" x="88" y="306">your tools</text>
  <text class="body" x="88" y="338">a sub-agent, run inside a tool</text>
  <text class="body" x="88" y="370">a plain model call, inside a tool</text>
  <text class="body" x="88" y="402">a thread id: what a conversation is</text>
  <line x1="88" y1="424" x2="492" y2="424" stroke="#243c53" stroke-width="2"/>
  <text class="mono-soft" x="88" y="460">langsmith · a dependency of langchain-core</text>

  <rect class="panel-soft" x="60" y="520" width="460" height="160" rx="14"/>
  <text class="mono" x="88" y="560">LANGSMITH_TRACING=true</text>
  <text class="mono" x="88" y="592">LANGSMITH_ENDPOINT=http://127.0.0.1:1985</text>
  <text class="mono" x="88" y="624">LANGSMITH_API_KEY=asz</text>
  <text class="mono" x="88" y="656">LANGSMITH_PROJECT=triage</text>

  <rect class="panel-purple" x="60" y="710" width="460" height="130" rx="14"/>
  <text class="label" x="88" y="750">asz-changes  +  the LangChain shim</text>
  <text class="body" x="88" y="784">scans the workspace around the tools</text>
  <text class="body" x="88" y="814">you name as writing, and records the diff</text>

  <!-- flows: agent -> receiver -->
  <path class="flow" d="M 520 340 C 560 340, 560 300, 600 300"/>
  <path class="flow-purple" d="M 520 775 C 560 775, 560 600, 600 600"/>

  <!-- sessionizer -->
  <rect class="panel-accent" x="600" y="190" width="460" height="130" rx="14"/>
  <text class="label" x="628" y="232">Receiver  ·  langsmith-ingest</text>
  <text class="body" x="628" y="266">speaks the tracing client's protocol,</text>
  <text class="body" x="628" y="296">listens on 127.0.0.1:1985, any key accepted</text>

  <path class="flow" d="M 830 320 L 830 350"/>
  <rect class="panel" x="600" y="360" width="460" height="130" rx="14"/>
  <text class="label" x="628" y="402">Session Data  ·  .sd</text>
  <text class="body" x="628" y="436">every run, tool call and model call as it arrived,</text>
  <text class="body" x="628" y="466">plus what each model call was sent</text>

  <path class="flow" d="M 830 490 L 830 520"/>
  <rect class="panel" x="600" y="530" width="460" height="130" rx="14"/>
  <text class="label" x="628" y="572">Assembly  ·  eight stages</text>
  <text class="body" x="628" y="606">streams, talks, runs, tool steps, relations;</text>
  <text class="body" x="628" y="636">change records joined to their tool calls</text>

  <path class="flow" d="M 830 660 L 830 690"/>
  <rect class="panel-accent" x="600" y="700" width="460" height="100" rx="14"/>
  <text class="label" x="628" y="742">Conversation  ·  .sf rounds</text>
  <text class="body" x="628" y="776">one durable structure, evidence attached</text>

  <!-- flows: conversation -> readers -->
  <path class="flow" d="M 1060 750 C 1100 750, 1100 320, 1140 320"/>
  <path class="flow" d="M 1060 750 C 1100 750, 1100 620, 1140 620"/>

  <!-- readers -->
  <rect class="panel" x="1140" y="190" width="400" height="260" rx="14"/>
  <text class="label" x="1168" y="232">Local page  ·  :8787</text>
  <text class="body" x="1168" y="272">talks, runs and tool steps</text>
  <text class="body" x="1168" y="302">the sub-agent in its own stream</text>
  <text class="body" x="1168" y="332">what each model call was sent</text>
  <text class="body" x="1168" y="362">what each tool call changed</text>
  <text class="body" x="1168" y="392">work still running, as it runs</text>
  <text class="mono-soft" x="1168" y="430">asz conversation ls-triage-…</text>

  <rect class="panel" x="1140" y="490" width="400" height="260" rx="14"/>
  <text class="label" x="1168" y="532">SkyWalking  ·  for the team</text>
  <text class="body" x="1168" y="572">export.otlp → OAP 11.1</text>
  <text class="body" x="1168" y="602">Horizon UI 1.1, AI Agents views</text>
  <text class="body" x="1168" y="632">runtime: LangChain, beside Claude Code</text>
  <text class="body" x="1168" y="662">the same conversation renderer,</text>
  <text class="body" x="1168" y="692">so it looks the same everywhere</text>

  <text class="note" x="1140" y="820">Nothing is sampled, nothing is redacted, and no line of the agent changes.</text>
</svg>
