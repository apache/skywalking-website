# Get started: the runnable Showcase and SkyWalking installation quickstarts.
# Keep installation commands in sync with content/quickstart-docker.{sh,ps1}.
showcase:
  name: SkyWalking Showcase
  icon: skywalking
  description: A demo music application to showcase features of Apache SkyWalking in action.
  user: apache
  repo: skywalking-showcase
  repoUrl: https://github.com/apache/skywalking-showcase.git
  next:
    docs:
      link: /docs/skywalking-showcase/next/readme/
      label: showcase for v10
  quickstart:
    title: Run the Showcase
    blurb: A demo music application pre-wired with distributed tracing, metrics, logs and profiling — see SkyWalking end-to-end before installing anything.
    badge: Recommended for newcomers
    docsLabel: Showcase docs
    tabs:
      - os: macOS / Linux / WSL
        lang: bash
        code: |
          git clone https://github.com/apache/skywalking-showcase
          cd skywalking-showcase
          make deploy.docker
          # → open http://localhost:8080

  diagram:
    title: See what’s inside the Showcase
    description: Follow a request through a music app, then explore the SkyWalking components that make its behavior visible. Select a component to learn what it does.
    views:
      - id: application
        label: Music application
        description: A music app built from services in four languages. Follow its HTTP requests, database calls, and messages.
        columns: 6
        rows: 3
        nodes:
          - id: load
            title: Load generator
            subtitle: Browser automation
            kind: traffic
            column: 1
            row: 1
            description: Automated browser sessions exercise the music UI and generate traffic for the demo.
          - id: browser
            title: Music UI
            subtitle: React · browser
            kind: frontend
            column: 1
            row: 2
            description: The React interface loads its assets and sends backend HTTP requests through APISIX.
          - id: apisix
            title: APISIX
            subtitle: Web gateway
            kind: gateway
            column: 2
            row: 2
            description: Serves the music UI and proxies its backend requests to the Node.js application.
          - id: app
            title: App server
            subtitle: Node.js · Express
            kind: service
            column: 3
            row: 2
            description: Builds the homepage by requesting top songs and recommendations through the Spring gateway.
          - id: gateway
            title: Gateway
            subtitle: Java · Spring
            kind: gateway
            column: 4
            row: 2
            description: Routes requests to the Songs service and the Python Recommendations service.
          - id: songs
            title: Songs
            subtitle: Java · Spring
            kind: service
            column: 5
            row: 1
            description: Provides song data from an embedded H2 database, and produces and consumes ActiveMQ messages.
          - id: recommendations
            title: Recommendations
            subtitle: Python · Flask
            kind: service
            column: 5
            row: 3
            description: Combines song data from Songs with ratings from the Go service to produce recommendations.
          - id: h2
            title: H2
            subtitle: Embedded database
            kind: database
            column: 6
            row: 1
            description: The application database embedded in the Songs service. SkyWalking telemetry is stored separately in BanyanDB.
          - id: activemq
            title: ActiveMQ
            subtitle: JMS messaging
            kind: messaging
            column: 6
            row: 2
            description: Songs publishes and consumes JMS messages, adding asynchronous messaging to the demo.
          - id: rating
            title: Rating
            subtitle: Go service
            kind: service
            column: 6
            row: 3
            description: Returns ratings used by the Recommendations service.
        edges:
          - from: load
            to: browser
          - from: browser
            to: apisix
          - from: apisix
            to: app
          - from: app
            to: gateway
          - from: gateway
            to: songs
          - from: gateway
            to: recommendations
          - from: recommendations
            to: songs
          - from: recommendations
            to: rating
          - from: songs
            to: h2
          - from: songs
            to: activemq
            bidirectional: true
        paths:
          - id: songs
            label: Browse songs
            nodes:
              - load
              - browser
              - apisix
              - app
              - gateway
              - songs
              - h2
            edges:
              - from: load
                to: browser
              - from: browser
                to: apisix
              - from: apisix
                to: app
              - from: app
                to: gateway
              - from: gateway
                to: songs
              - from: songs
                to: h2
          - id: recommendations
            label: Get recommendations
            nodes:
              - load
              - browser
              - apisix
              - app
              - gateway
              - recommendations
              - songs
              - h2
              - rating
              - activemq
            edges:
              - from: load
                to: browser
              - from: browser
                to: apisix
              - from: apisix
                to: app
              - from: app
                to: gateway
              - from: gateway
                to: recommendations
              - from: recommendations
                to: songs
              - from: recommendations
                to: rating
              - from: songs
                to: h2
              - from: songs
                to: activemq
      - id: telemetry
        label: Observability stack
        description: Native agents and ecosystem integrations feed OAP. Showcase's monitoring collectors use OTLP metrics; its Kubernetes mesh scenario adds ALS access logs and Zipkin traces.
        columns: 3
        rows: 4
        nodes:
          - id: instrumented-app
            title: Instrumented app
            subtitle: SkyWalking agents
            kind: agent
            column: 1
            row: 1
            description: Agents instrument the music application and report telemetry to OAP. These signals connect requests across the different services.
          - id: otlp
            title: OpenTelemetry
            subtitle: OTLP ecosystem
            kind: integration
            column: 1
            row: 2
            description: Showcase uses OpenTelemetry Collectors to scrape infrastructure, database, and messaging metrics and send them to OAP over OTLP. OAP also accepts OTLP traces and logs from compatible SDKs and collectors when their receivers are enabled; these are additional integration options.
          - id: istio-envoy
            title: Istio / Envoy
            subtitle: Access Log Service
            kind: integration
            column: 1
            row: 3
            description: The Kubernetes mesh scenario sends Envoy HTTP and TCP access logs through ALS. OAP derives service topology and metrics without application agents. ALS is a service mesh integration, separate from trace collection; Satellite can relay its data to OAP when selected.
          - id: zipkin
            title: Zipkin ecosystem
            subtitle: Compatible tracers
            kind: integration
            column: 1
            row: 4
            description: Zipkin-compatible tracers send spans directly to OAP. Showcase's Kubernetes mesh scenario uses Envoy's Zipkin exporter for this path, alongside ALS access logs. OAP provides the trace receiver and query APIs, so no separate Zipkin server is required.
          - id: oap
            title: SkyWalking OAP
            subtitle: Analyze telemetry
            kind: observability
            column: 2
            row: 2
            rowSpan: 2
            description: Receives and analyzes telemetry, builds service topology, and serves queries from the UI. The Showcase supports a single node or a two-node OAP cluster.
          - id: banyandb
            title: BanyanDB
            subtitle: Telemetry storage
            kind: database
            column: 3
            row: 2
            description: The default storage for SkyWalking telemetry. OAP writes and queries observability data here; this is separate from the music app's H2 database.
          - id: horizon
            title: Horizon UI
            subtitle: Explore your systems
            kind: frontend
            column: 3
            row: 3
            description: Queries OAP to explore topology, traces, metrics, logs, and other enabled observability features. The UI does not query the music application database.
        edges:
          - from: instrumented-app
            to: oap
            label: Native telemetry
          - from: otlp
            to: oap
            label: OTLP metrics
          - from: istio-envoy
            to: oap
            label: ALS access logs
          - from: zipkin
            to: oap
            label: Zipkin traces
          - from: oap
            to: banyandb
            label: Store & query
            bidirectional: true
          - from: horizon
            to: oap
            label: Query
    scenarios:
      - title: Service mesh & networking
        description: Istio / Envoy ALS access log analysis and Zipkin tracing, services with agents in a mesh, and Cilium service traffic.
        platform: Kubernetes
      - title: Profiling
        description: Java and Python trace profiling, plus Rover for eBPF process discovery.
        platform: Kubernetes
      - title: Databases & storage
        description: MySQL, PostgreSQL, Elasticsearch, MongoDB, and BanyanDB monitoring.
      - title: Messaging & gateways
        description: ActiveMQ, RabbitMQ, RocketMQ, Pulsar, Nginx, and APISIX monitoring.
      - title: Infrastructure & events
        description: Metrics from simulated hosts, Kubernetes monitoring and events, and SkyWalking self-observability.
      - title: Collection & visualization
        description: Satellite for telemetry load balancing, and Grafana for metrics and logs.
      - title: More analysis
        description: Flink monitoring, R3 URL recognition, and SkyPredictor metric baselines. R3 and SkyPredictor run on Kubernetes.

skywalking:
  title: Run SkyWalking
  blurb: Start the storage, OAP server and UI with a one-liner. Requires Docker; you'll be prompted to choose a storage backend.
  badge: Install the platform
  docsLabel: Backend setup docs
  docsLink: /docs/main/latest/en/setup/backend/backend-docker/
  tabs:
    - os: Linux / macOS / WSL
      lang: bash
      code: |
        bash <(curl -sSL https://skywalking.apache.org/quickstart-docker.sh)
    - os: Windows (PowerShell)
      lang: powershell
      code: |
        Invoke-Expression ([System.Text.Encoding]::UTF8.GetString((Invoke-WebRequest -Uri https://skywalking.apache.org/quickstart-docker.ps1 -UseBasicParsing).Content))
