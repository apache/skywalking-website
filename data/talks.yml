      - title: 如何利用 Apache APISIX 提升 Nginx 的可观测性
        speaker: 金卫 Wei Jin
        intro: >-
          Apache APISIX 在覆盖 Nginx 传统功能之外，如何与 SkyWalking 深度集成，无痛提升 Nginx 的可观测性。

