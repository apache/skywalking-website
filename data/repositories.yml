# Every repository whose contributors this site counts, grouped into the contribution
# categories of the Certificate of Contribution (/certificate/).
#
# Each repository listed in data/projects.yml, the Showcase (data/get-started.yml) and the
# Website (package.json) must appear here exactly once, as owner/repo. A new repository is
# added to its category here in the same change that adds it to the site;
# scripts/project-config.js rejects the configuration otherwise, which fails the build.
#
# Category order is the order of the vertices of the certificate's contribution polygon,
# clockwise from the top. Archived and retired repositories stay in their category.
categories:
  - id: protocol
    name: Protocol
    repos:
      - apache/skywalking-data-collect-protocol
      - apache/skywalking-query-protocol
      - apache/skywalking-goapi

  - id: main
    name: Main
    repos:
      - apache/skywalking
      - apache/skywalking-graalvm-distro
      - apache/skywalking-ai-sessionizer

  - id: agent
    name: Agent
    repos:
      - apache/skywalking-java
      - apache/skywalking-python
      - apache/skywalking-nodejs
      - apache/skywalking-go
      - apache/skywalking-rust
      - apache/skywalking-php
      - apache/skywalking-client-js
      - apache/skywalking-ruby
      - apache/skywalking-nginx-lua
      - apache/skywalking-kong
      - apache/skywalking-satellite
      - apache/skywalking-kubernetes-event-exporter
      - apache/skywalking-rover

  - id: database
    name: Database
    repos:
      - apache/skywalking-banyandb
      - apache/skywalking-banyandb-client-proto
      - apache/skywalking-banyandb-helm
      - apache/skywalking-banyandb-java-client

  - id: website
    name: Blogs & Website
    repos:
      - apache/skywalking-website

  - id: tools
    name: Tools
    repos:
      - apache/skywalking-eyes
      - apache/skywalking-infra-e2e
      - apache/skywalking-helm
      - apache/skywalking-swck
      - apache/skywalking-cli
      - apache/skywalking-mcp
      - apache/skywalking-agent-test-tool
      - apache/skywalking-showcase
      - apache/skywalking-docker
      - apache/skywalking-oal-tool

  - id: visualization
    name: Visualization
    repos:
      - apache/skywalking-horizon-ui
      - apache/skywalking-booster-ui
      - apache/skywalking-rocketbot-ui
      - apache/skywalking-ui
      - apache/skywalking-grafana-plugins

  - id: community
    name: Community Projects
    repos:
      - SkyAPM/SkyAPM-dotnet
      - SkyAPM/cpp2sky
      - SkyAPM/java-plugin-extensions
      - SkyAPM/uranus
      - SkyAPM/document-cn-translation-of-skywalking
      - SkyAPM/transporter-plugin-for-skywalking
      - SkyAPM/go2sky
      - SkyAPM/go2sky-plugins
      - SkyAPM/SkyAPM-php-sdk
      - SkyAPM/SkyAPM-nodejs
      - sourceplusplus/SourceMarker
