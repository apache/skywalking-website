# Unified project catalog. Each released version owns its documentation and downloads.
# Keep exactly one latest release per project; next contains development documentation.
# Documentation commit IDs are intentional: preserve them and never infer them from release tags.
# latestCommitId pins the Latest documentation independently of the numbered release's commitId.
# Project dockerImages entries are Docker Hub repository links, not version-pinned image tags.
catalogs:
  - id: SkyWalkingServers
    name: Platform & visualization
    description: Analyze telemetry, explore your systems, and understand AI agent sessions.
    projects:
      - name: SkyWalking
        repo: skywalking
        user: apache
        repoUrl: https://github.com/apache/skywalking.git
        icon: skywalking
        description: SkyWalking primary repository and docs.
        extraContributors:
          - login: Adrian Cole
          - login: github-actions[bot]
