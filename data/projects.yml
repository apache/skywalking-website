        featured:
          order: 0
          label: Observability platform
          description: Bring traces, metrics, logs, and profiling together to understand your services.
        menu:
          group: Platform
          column: 0
          order: 0
          description: Core observability server
        next:
          docs:
            link: /docs/main/next/readme/
        dockerImages:
