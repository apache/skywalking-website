# Single source of truth for blog topics (a.k.a. "tags").
#
# Used by:
#   - layouts/blog/list.html  + layouts/zh/list.html     — Browse-topics dropdown cards
#   - layouts/partials/blog-topic-styles.html            — generates the
#                                                          .blog-label[data-label="X"]
#                                                          color rules at build time
#
# To add a 12th topic: append an entry here, then use that exact `name` as a
# tag in any blog post's frontmatter. No template / SCSS changes required.
#
# Field reference:
#   name      Canonical tag string. Match exactly in post frontmatter `tags:`.
#   intro     One-line EN description, shown on the /blog/ Browse-topics dropdown card.
#   intro_zh  CN counterpart, shown on the /zh/ Browse-topics dropdown card.
#   color     bg/fg/border for the colored pill. Bg should be a light tint,
#             fg the accessible darker text/icon color, border the same hue
#             slightly deeper than bg.
topics:
  - name: Release
    intro: Version announcements and release-engineering notes.
    intro_zh: 各组件版本发布说明与发布工程实践。
    color: { bg: "#e6f6ec", fg: "#1a7f43", border: "#bfe8cd" }

  - name: AI
    intro: Observing GenAI and LLM apps — token cost, latency, prompts and Spring AI.
    intro_zh: 观察 GenAI 与 LLM 应用 —— 调用、成本、延迟、提示词与 Spring AI。
    color: { bg: "#fde8f3", fg: "#be2069", border: "#f8cbe2" }

  - name: Tracing
    intro: Distributed tracing, OpenTelemetry, Zipkin and TraceQL.
    intro_zh: 分布式追踪、OpenTelemetry、Zipkin 与 TraceQL。
    color: { bg: "#fdecde", fg: "#c2580d", border: "#f6d4ba" }

  - name: Metrics
    intro: MAL, PromQL, dashboards and Grafana integrations.
    intro_zh: MAL、PromQL、仪表盘与 Grafana 集成。
    color: { bg: "#e2f1fd", fg: "#1d6fb8", border: "#c4e1f7" }

  - name: Logging
    intro: Trace-correlated logs, LAL pipelines and log analytics.
    intro_zh: 与 Trace 关联的日志、LAL 处理管线与日志分析。
    color: { bg: "#f0e7fd", fg: "#7c3aed", border: "#ddccfa" }

  - name: Profiling
    intro: eBPF, async-profile and continuous profiling deep-dives.
    intro_zh: eBPF、异步采样与持续 Profiling 深度解析。
    color: { bg: "#def5e7", fg: "#11814b", border: "#bce8cf" }

  - name: Storage
    intro: BanyanDB, Elasticsearch, ClickHouse and other storage backends.
    intro_zh: BanyanDB、Elasticsearch、ClickHouse 等存储后端。
    color: { bg: "#e0f7fa", fg: "#0e7490", border: "#bdeaf1" }

  - name: Agents
    intro: Language and framework probes — Java, Go, Ruby, browser EUM, mobile, MQ clients.
    intro_zh: 各语言与框架探针:Java、Go、Ruby、浏览器、移动端与消息队列客户端。
    color: { bg: "#e8eafd", fg: "#4f46e5", border: "#d3d7fa" }

  - name: Cloud Native
    intro: Kubernetes, service mesh, sidecars and serverless observability.
    intro_zh: Kubernetes、服务网格、Sidecar 与 Serverless 可观测性。
    color: { bg: "#e6f3fe", fg: "#0369a1", border: "#c5e4fb" }

  - name: Engineering
    intro: Architecture, performance and the internals of OAP and BanyanDB.
    intro_zh: 架构设计、性能优化与 OAP / BanyanDB 内部实现。
    color: { bg: "#fef3e2", fg: "#b45309", border: "#fbe0bb" }

  - name: Community
    intro: Releases, events, OSPP, mentorship and user case studies.
    intro_zh: 版本发布、活动、OSPP、导师计划与用户案例分享。
    color: { bg: "#eef1f5", fg: "#5b6573", border: "#e1e6ee" }
